const AT=['placeholder','aria-label','title'];
const att=n=>AT.forEach(a=>{const x=n.getAttribute&&n.getAttribute(a);if(x){const v=tr(x);if(v!==x)n.setAttribute(a,v)}});
const walk=n=>{if(n.nodeType===3){const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}else if(n.nodeType===1){att(n);if(!['SCRIPT','STYLE','TEXTAREA'].includes(n.tagName))n.childNodes.forEach(walk)}};
const root=document.getElementById('root');
new MutationObserver(ms=>ms.forEach(m=>{if(m.type==='characterData'){if(!(m.target.parentNode&&m.target.parentNode.tagName==='TEXTAREA'))walk(m.target)}else if(m.type==='attributes')att(m.target);else m.addedNodes.forEach(walk)})).observe(root,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:AT});}
class EB extends React.Component{constructor(p){super(p);this.state={e:null}}static getDerivedStateFromError(e){return{e}}render(){return this.state.e?React.createElement('pre',{style:{padding:16,whiteSpace:'pre-wrap',color:'#b3261e',fontSize:13}},'Грешка в приложението: '+String(this.state.e&&(this.state.e.message||this.state.e))):this.props.children}}
