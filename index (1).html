<div data-f className="card p-3 space-y-2"><h3 className="text-lg">Нова забележка</h3>
<div className="flex gap-2"><select name="k" className="inp">${KINDS.map(k=>html`<option key=${k}>${k}</option>`)}</select>
<select name="fu" className="inp"><option value="0">Общо за обекта</option>${allF.map(f=>html`<option key=${f.id} value=${f.id}>${f.name}</option>`)}</select></div>
<textarea name="nt" className="inp py-2" rows="3" placeholder="Опиши какво е забелязано…"></textarea>
${ast&&html`<input name="ph" type="file" accept="image/*" className="inp py-2"/>`}<button className="btn pri w-full" onClick=${addNote}>+ Запази забележката</button></div>
${sorted.length===0&&html`<p style=${{color:'var(--mut)'}}>Още няма забележки. Добави първата отгоре.</p>`}
${sorted.map(n=>html`<div key=${n.id} className="card p-3 flex gap-3 items-start" style=${{opacity:n.done?0.6:1,borderLeft:n.kind==='Проблем'&&!n.done?'6px solid var(--bad)':undefined}}>
<${Ck} on=${n.done} label="Решена" f=${()=>upd(p=>{const q=p.log.find(y=>y.id===n.id);q.done=!q.done})}/>
<div className="flex-1 min-w-0"><div className="text-sm font-semibold">${n.kind}${n.furn?' · '+(allF.find(f=>f.id===n.furn)||{name:'изтрит мебел'}).name:''}</div>
<div className="whitespace-pre-wrap">${n.text}</div>${n.photo&&html`<${Photo} path=${n.photo} open=${setZoom}/>`}<div className="text-xs" style=${{color:'var(--mut)'}}>${n.by} · ${fmt(n.date)}${n.done?' · решена':''}</div></div>
${adm&&html`<button aria-label="Изтрий" className="px-2 text-xl" style=${{color:'var(--mut)'}} onClick=${()=>upd(p=>{p.log=p.log.filter(y=>y.id!==n.id)})}>×</button>`}</div>`)}</div>`})();
const furnTab=html`<div className="space-y-4">${proj.rooms.map(r=>html`<section key=${r.id}><h2 className="text-xl mb-2">${r.name}</h2>
<div className="space-y-2">${roomOf(r).map(furnCard)}</div>
<div data-f className="space-y-2 mt-2"><${Pick} name="fn" list=${cat.furn} ph=${'Избери мебел за „'+r.name+'“'}/><button className="btn pri w-full" onClick=${e=>addFurn(r.id,e)}>+ Добави мебел</button></div></section>`)}
<div data-f className="card p-3 space-y-2"><${Pick} name="rm" list=${cat.rooms} ph="Избери стая"/><button className="btn pri w-full" onClick=${addRoom}>+ Добави стая</button></div>${tplBox}</div>`;

return html`<div>${head}<main className="p-4 max-w-2xl mx-auto space-y-4">
<div className="card p-4 space-y-2"><div className="flex flex-wrap gap-x-4 gap-y-1"><span>📅 <b>${fmt(proj.date)}</b> (${days(proj.date)>=0?'след '+days(proj.date)+' дни':'минал'})</span></div>
<a className="block font-semibold underline" style=${{color:'var(--pri)'}} href=${'tel:'+proj.phone.replace(/\s/g,'')}>📞 ${proj.phone}</a><div>📍 ${proj.addr}</div>
${proj.notes&&html`<div className="p-3 rounded-lg text-sm" style=${{background:'var(--bg)',borderLeft:'5px solid var(--acc)'}}>${proj.notes}</div>`}
${crewBox}
${adm&&(ed==='proj'?html`<div data-f className="space-y-2"><input name="name" defaultValue=${proj.name} className="inp"/><input name="phone" defaultValue=${proj.phone} className="inp"/><input name="addr" defaultValue=${proj.addr} className="inp"/><input name="date" type="date" defaultValue=${proj.date} className="inp"/><textarea name="notes" defaultValue=${proj.notes} className="inp py-2" rows="3" placeholder="Бележки за обекта"></textarea><div className="flex gap-2"><button className="btn pri flex-1" onClick=${saveProj}>Запази</button><button className="btn" onClick=${()=>setEd(null)}>Откажи</button></div></div>`:html`<button className="btn w-full" onClick=${()=>setEd('proj')}>✎ Редактирай данните за обекта</button>`)}
<div className="text-sm font-semibold pt-1">Статус на обекта</div>
<div className="flex gap-2 overflow-x-auto pb-1">${PS.map((s,i)=>html`<button key=${i} className=${'chip '+(proj.status===i?'on':'')} onClick=${()=>upd(p=>{p.status=i})}>${s}</button>`)}</div></div>
<div className="flex gap-2 noprint">${[['furn','Мебели'],['pack','Чеклист'],['ord','Поръчка'+(bad.length?' ('+bad.length+')':'')],['notes','Забележки'+(openN?' ('+openN+')':'')]].map(([k,t])=>html`<button key=${k} className=${'btn flex-1 px-1 text-sm '+(tab===k?'pri':'')} onClick=${()=>setTab(k)}>${t}</button>`)}</div>
${tab==='furn'?furnTab:tab==='pack'?pack:tab==='ord'?orderBox:notesTab}
<button className="btn w-full noprint" onClick=${()=>{if(tab==='furn')setOpen('all');setTimeout(()=>window.print(),300)}}>🖨 Печат / PDF</button></main>
${zoom&&html`<${Lightbox} src=${zoom} onClose=${()=>setZoom(null)}/>`}</div>`;
}
function fs2(f){return f.fs}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
